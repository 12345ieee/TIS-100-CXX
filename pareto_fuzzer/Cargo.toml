[package]
name = "pareto_fuzzer"
version = "0.0.1"
authors = [
  "Andrea Fioraldi <andreafioraldi@gmail.com>",
  "Dominik Maier <domenukk@gmail.com>",
]
edition = "2021"

[features]
default = ["std"]
tui = []
std = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
debug = true

[dependencies]
env_logger = "0.11.7"
libafl = { version = "0.15", features = ["tui_monitor"] }
libafl_bolts = { version = "0.15" }
log = { version = "0.4.22", features = ["release_max_level_info"] }
serde = { version = "1.0", features = ["derive"] }
